<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fee Calculator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #37352f;
    background: transparent;
    padding: 32px 24px;
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.5;
  }

  .input-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 14px;
    color: #787774;
    margin-bottom: 6px;
    font-weight: 500;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid #e3e2e0;
    border-radius: 6px;
    outline: none;
    font-family: inherit;
    color: #37352f;
    transition: border-color 0.15s;
  }

  input:focus {
    border-color: #eb6d56;
    box-shadow: 0 0 0 2px rgba(235, 109, 86, 0.15);
  }

  .results {
    display: none;
    margin-top: 28px;
  }

  .results.visible { display: block; }

  .result-card {
    background: #f7f6f3;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 12px;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
  }

  .result-row + .result-row {
    border-top: 1px solid #e9e8e5;
  }

  .result-label {
    font-size: 14px;
    color: #787774;
  }

  .result-value {
    font-size: 16px;
    font-weight: 600;
    text-align: right;
  }

  .total-row .result-label {
    font-size: 15px;
    font-weight: 600;
    color: #37352f;
  }

  .total-row .result-value {
    font-size: 18px;
  }

  .hint-card {
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 12px;
    font-size: 14px;
    line-height: 1.6;
  }

  .hint-card.blue,
  .hint-card.green,
  .hint-card.orange,
  .hint-card.red {
    background: #f7f6f3;
    color: #4a4a47;
  }

  .hint-title {
    font-weight: 600;
    margin-bottom: 2px;
  }

  .timeline {
    display: flex;
    gap: 2px;
    margin-top: 20px;
    margin-bottom: 8px;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
  }

  .timeline-segment {
    flex: 1;
    background: #e3e2e0;
    position: relative;
    transition: background 0.3s;
  }

  .timeline-segment.passed { background: #787774; }
  .timeline-segment.active {
    background: linear-gradient(to right, #eb6d56 var(--progress, 0%), #e3e2e0 var(--progress, 0%));
  }

  .timeline-labels {
    display: flex;
    gap: 2px;
    font-size: 11px;
    color: #a09f9c;
  }

  .timeline-labels span {
    flex: 1;
    text-align: center;
  }

  .timeline-labels span.active {
    color: #eb6d56;
    font-weight: 600;
  }

  .section-label {
    font-size: 12px;
    color: #a09f9c;
    margin-bottom: 10px;
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  .stage-section {
    margin-bottom: 24px;
  }

  .stage-section.preview {
    opacity: 0.55;
  }

  .tier-strip {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }

  .tier-hint {
    font-size: 13px;
    color: #a09f9c;
    margin-bottom: 20px;
  }

  .tier-pill {
    flex: 1;
    border: 1.5px solid #e3e2e0;
    border-radius: 8px;
    padding: 10px 4px;
    text-align: center;
    transition: all 0.2s;
  }

  .tier-pill .tier-fee {
    font-size: 15px;
    font-weight: 600;
    color: #787774;
  }

  .tier-pill .tier-range {
    font-size: 11px;
    color: #a09f9c;
    margin-top: 2px;
  }

  .tier-pill.active {
    border-color: #787774;
    background: #f7f6f3;
  }

  .tier-pill.active .tier-fee {
    color: #37352f;
  }

  .tier-pill.active .tier-range {
    color: #787774;
  }

  .tier-pill.passed {
    border-color: #e3e2e0;
    background: transparent;
    opacity: 0.5;
  }

  .error-text {
    color: #eb5757;
    font-size: 13px;
    margin-top: 6px;
    display: none;
  }

  @media (prefers-color-scheme: dark) {
    body { background: #191919; color: #e3e2e0; }
    input { background: #2f2f2f; border-color: #444; color: #e3e2e0; }
    input:focus { border-color: #eb6d56; box-shadow: 0 0 0 2px rgba(235, 109, 86, 0.25); }
    .result-card { background: #2f2f2f; }
    .result-row + .result-row { border-color: #444; }
    .result-label { color: #9b9a97; }
    .total-row .result-label { color: #e3e2e0; }
    .hint-card.blue, .hint-card.green, .hint-card.orange, .hint-card.red { background: #3a3a3a; color: #b0b0ad; }
    .section-label { color: #666; }
    .tier-pill { border-color: #444; }
    .tier-pill .tier-fee { color: #9b9a97; }
    .tier-pill .tier-range { color: #666; }
    .tier-pill.active { border-color: #9b9a97; background: #2f2f2f; }
    .tier-pill.active .tier-fee { color: #e3e2e0; }
    .tier-pill.active .tier-range { color: #9b9a97; }
    .tier-hint { color: #666; }
    .timeline-segment { background: #444; }
    .timeline-segment.active { background: linear-gradient(to right, #eb6d56 var(--progress, 0%), #444 var(--progress, 0%)); }
    .timeline-labels { color: #666; }
    label { color: #9b9a97; }
  }

</style>
</head>
<body>

<h2 id="page-title" style="display:none;margin-bottom:24px;font-size:18px;font-weight:600;"></h2>

<div class="input-group">
  <label>Your Contribution Amount (USD)</label>
  <input type="text" id="amount" placeholder="e.g. $6,000,000" inputmode="numeric">
</div>

<div class="input-group" id="approval-date-group">
  <label id="approval-date-label">Admission Board Approval Date</label>
  <input type="date" id="approval-date">
</div>

<div class="input-group" id="approval-date-display" style="display:none;">
  <label id="approval-date-display-label">Admission Board Approval Date</label>
  <div id="approval-date-text" style="font-size:16px;font-weight:500;"></div>
</div>

<div class="input-group" id="sign-date-group" style="display:none;">
  <label>Forward Contract Signing Date (leave empty if not yet signed)</label>
  <input type="date" id="sign-date">
</div>

<div class="input-group" id="sign-date-display" style="display:none;">
  <label>Forward Contract Signing Date</label>
  <div id="sign-date-text" style="font-size:16px;font-weight:500;"></div>
</div>

<p class="error-text" id="error"></p>

<div class="results" id="results">

  <div id="tier-section">
    <div class="section-label">Admission Fee by Contribution Amount</div>
    <div class="tier-strip" id="tier-strip"></div>
    <div class="tier-hint" id="tier-hint"></div>
  </div>

  <div class="hint-card" id="timing-card">
    <div class="hint-title" id="timing-title"></div>
    <div id="timing-text"></div>
  </div>

  <div class="stage-section" id="stage1-section">
    <div class="section-label" id="stage1-label">Deal Closing Cost: Contribute Stage</div>
    <div class="timeline" id="stage1-bar"></div>
    <div class="timeline-labels" id="stage1-labels"></div>
  </div>

  <div class="stage-section" id="stage2-section">
    <div class="section-label" id="stage2-label">Deal Closing Cost: Activate Stage</div>
    <div class="timeline" id="stage2-bar"></div>
    <div class="timeline-labels" id="stage2-labels"></div>
  </div>

  <div id="legacy-timeline-section" style="display:none;">
    <div class="section-label">Deal closing cost by days since board approval</div>
    <div class="timeline" id="timeline-bar"></div>
    <div class="timeline-labels" id="timeline-labels"></div>
  </div>

</div>

<script>
// Config is passed via URL parameters.
//
// Two-stage (current model):
// ?tiers=5000000:15,7000000:12,10000000:9.5,12000000:7.5,15000000:7.25,0:7
// &stage1=90:0,120:1,150:2,0:3       (Contribution Stage: days-since-admission → cumulative fee %)
// &stage2=45:0,90:1,0:2              (Activation Stage: days-since-signing  → cumulative fee %)
// &date=2026-03-15                   (Admission Board approval date)
// &signdate=2026-04-20               (Forward contract signing date, optional)
// &title=Your+Fee+Estimate
//
// Legacy single-stage (still supported for old embeds):
// ?tiers=...&timing=90:0,150:2.5,240:3.75,0:5&date=2026-03-15

const params = new URLSearchParams(window.location.search);

function parseTiers(str) {
  if (!str) return [];
  return str.split(',').map(pair => {
    const [max, fee] = pair.split(':');
    return { max: max === '0' ? Infinity : parseFloat(max), fee: parseFloat(fee) };
  });
}

function parseTiming(str) {
  if (!str) return [];
  return str.split(',').map(pair => {
    const [days, fee] = pair.split(':');
    return { maxDays: days === '0' ? Infinity : parseFloat(days), fee: parseFloat(fee) };
  });
}

const TIERS = parseTiers(params.get('tiers'));
const STAGE1 = parseTiming(params.get('stage1'));
const STAGE2 = parseTiming(params.get('stage2'));
const LEGACY_TIMING = parseTiming(params.get('timing'));
const presetDate = params.get('date');
const presetSignDate = params.get('signdate');
const pageTitle = params.get('title');

const TWO_STAGE = STAGE1.length > 0;
const HAS_LEGACY = LEGACY_TIMING.length > 0;

if (!TIERS.length || (!TWO_STAGE && !HAS_LEGACY)) {
  document.body.innerHTML = '<p style="color:#787774;padding:40px;text-align:center;">Calculator not configured.</p>';
}

const presetAmount = params.get('amount');
const UPLIFT = parseFloat(params.get('uplift')) || 0;

function normalizeDate(str) {
  if (!str) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  var d = new Date(str);
  if (!isNaN(d)) return d.toISOString().split('T')[0];
  return null;
}

const normalizedApprovalDate = normalizeDate(presetDate);
const normalizedSignDate = normalizeDate(presetSignDate);

function formatDateForDisplay(isoDate) {
  var d = new Date(isoDate + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

document.addEventListener('DOMContentLoaded', function () {
  // Legacy mode hides stage sections, shows single legacy timeline + legacy label
  if (!TWO_STAGE) {
    document.getElementById('stage1-section').style.display = 'none';
    document.getElementById('stage2-section').style.display = 'none';
    document.getElementById('legacy-timeline-section').style.display = 'block';
    document.getElementById('approval-date-label').textContent = 'Board approval date';
    document.getElementById('approval-date-display-label').textContent = 'Board approval date';
  }
  // Two-stage mode: sign-date input + Activation section are hidden by default;
  // they only appear when a valid signdate URL param is provided.

  if (normalizedApprovalDate) {
    document.getElementById('approval-date').value = normalizedApprovalDate;
    document.getElementById('approval-date-group').style.display = 'none';
    document.getElementById('approval-date-text').textContent = formatDateForDisplay(normalizedApprovalDate);
    document.getElementById('approval-date-display').style.display = 'block';
  }

  if (normalizedSignDate && TWO_STAGE) {
    document.getElementById('sign-date').value = normalizedSignDate;
    document.getElementById('sign-date-group').style.display = 'none';
    document.getElementById('sign-date-text').textContent = formatDateForDisplay(normalizedSignDate);
    document.getElementById('sign-date-display').style.display = 'block';
  }

  if (presetAmount) {
    var num = parseInt(presetAmount.replace(/[^0-9]/g, ''));
    if (num > 0) {
      document.getElementById('amount').value = '$' + num.toLocaleString('en-US');
    }
  }

  if (pageTitle) {
    const h = document.getElementById('page-title');
    if (h) { h.textContent = pageTitle; h.style.display = 'block'; }
  }

  calculate();
});

function getAdmissionFee(amount) {
  for (const t of TIERS) {
    if (amount < t.max) return t.fee;
  }
  return TIERS.length ? TIERS[TIERS.length - 1].fee : 0;
}

function getNextTier(amount) {
  for (let i = 0; i < TIERS.length - 1; i++) {
    if (amount < TIERS[i].max) {
      const next = TIERS[i + 1];
      const gap = TIERS[i].max - amount;
      return { gap, nextFee: next.fee, threshold: TIERS[i].max };
    }
  }
  return null;
}

// Calendar-date diff in local time. Avoids UTC drift in Paris small-hours.
function daysBetween(fromISO, toISO) {
  const [fy, fm, fd] = fromISO.split('-').map(Number);
  const [ty, tm, td] = toISO.split('-').map(Number);
  return Math.round((Date.UTC(ty, tm - 1, td) - Date.UTC(fy, fm - 1, fd)) / 86400000);
}

function daysSinceLocal(fromISO) {
  const now = new Date();
  const today = now.getFullYear() + '-'
    + String(now.getMonth() + 1).padStart(2, '0') + '-'
    + String(now.getDate()).padStart(2, '0');
  return daysBetween(fromISO, today);
}

function getSegmentForDays(curve, days) {
  for (let i = 0; i < curve.length; i++) {
    if (days <= curve[i].maxDays || i === curve.length - 1) {
      const daysLeft = curve[i].maxDays === Infinity ? 0 : curve[i].maxDays - days;
      return { fee: curve[i].fee, daysLeft, segmentIndex: i };
    }
  }
  return { fee: 0, daysLeft: 0, segmentIndex: 0 };
}

function formatUSD(n) {
  return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
}

function formatCompact(n) {
  if (n >= 1e6) return '$' + (n / 1e6) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3) + 'K';
  return '$' + n;
}

function parseAmount(str) {
  return parseFloat(str.replace(/[^0-9.]/g, ''));
}

function renderTimeline(curve, segmentIndex, daysInStage, barEl, labelsEl, isActiveStage) {
  barEl.innerHTML = '';
  labelsEl.innerHTML = '';
  let prevMax = 0;
  for (let i = 0; i < curve.length; i++) {
    const seg = document.createElement('div');
    seg.className = 'timeline-segment';
    if (segmentIndex !== null) {
      if (i < segmentIndex) {
        seg.classList.add('passed');
      } else if (i === segmentIndex && isActiveStage) {
        seg.classList.add('active');
        const segStart = i === 0 ? 0 : curve[i - 1].maxDays;
        const segEnd = curve[i].maxDays === Infinity ? segStart + 90 : curve[i].maxDays;
        const progress = Math.min(100, Math.max(0, (daysInStage - segStart) / (segEnd - segStart) * 100));
        seg.style.setProperty('--progress', progress + '%');
      } else if (i === segmentIndex && !isActiveStage) {
        // Locked stage — show its final landing segment as passed
        seg.classList.add('passed');
      }
    }
    barEl.appendChild(seg);

    const lbl = document.createElement('span');
    const rangeStart = prevMax === 0 ? '0' : (prevMax + 1);
    const rangeEnd = curve[i].maxDays === Infinity ? '+' : curve[i].maxDays;
    lbl.innerHTML = (curve[i].maxDays === Infinity ? (prevMax + 1) + '+' : rangeStart + '–' + rangeEnd) + ' days<br>' + curve[i].fee + '%';
    if (segmentIndex !== null && i === segmentIndex && isActiveStage) lbl.classList.add('active');
    labelsEl.appendChild(lbl);
    if (curve[i].maxDays !== Infinity) prevMax = curve[i].maxDays;
  }
}

function calculate() {
  const raw = document.getElementById('amount').value;
  const approvalDateVal = document.getElementById('approval-date').value;
  const signDateVal = TWO_STAGE ? document.getElementById('sign-date').value : '';
  const results = document.getElementById('results');
  const error = document.getElementById('error');

  const amount = parseAmount(raw);
  if (!amount || amount <= 0) {
    results.classList.remove('visible');
    error.style.display = 'none';
    return;
  }
  if (!approvalDateVal) {
    results.classList.remove('visible');
    error.textContent = 'Please select the ' + (TWO_STAGE ? 'Admission Board approval' : 'board approval') + ' date.';
    error.style.display = 'block';
    return;
  }

  error.style.display = 'none';

  const admissionFee = getAdmissionFee(amount);

  // Tier strip
  const strip = document.getElementById('tier-strip');
  strip.innerHTML = '';
  for (let i = 0; i < TIERS.length; i++) {
    const pill = document.createElement('div');
    pill.className = 'tier-pill';
    const tierFee = TIERS[i].fee;
    const isActive = tierFee === admissionFee;
    const isPassed = TIERS[i].fee > admissionFee;
    if (isActive) pill.classList.add('active');
    if (isPassed) pill.classList.add('passed');

    let rangeLabel;
    if (i === 0) {
      rangeLabel = '<' + formatCompact(TIERS[0].max);
    } else {
      rangeLabel = '≥' + formatCompact(TIERS[i - 1].max);
    }

    pill.innerHTML = '<div class="tier-fee">' + (tierFee + UPLIFT) + '%</div><div class="tier-range">' + rangeLabel + '</div>';
    strip.appendChild(pill);
  }

  const effectiveAdmissionFee = admissionFee + UPLIFT;

  const nextTier = getNextTier(amount);
  const tierHint = document.getElementById('tier-hint');
  if (nextTier) {
    const nextEffective = nextTier.nextFee + UPLIFT;
    tierHint.textContent = 'Your fee: ' + effectiveAdmissionFee + '%. Add ' + formatUSD(nextTier.gap) + ' to reach ' + nextEffective + '%.';
  } else {
    tierHint.textContent = 'Your fee: ' + effectiveAdmissionFee + '% — lowest tier';
  }

  const timingCard = document.getElementById('timing-card');
  const timingTitle = document.getElementById('timing-title');
  const timingText = document.getElementById('timing-text');
  timingCard.className = 'hint-card';

  if (TWO_STAGE) {
    // Two-stage path
    const stage1Section = document.getElementById('stage1-section');
    const stage2Section = document.getElementById('stage2-section');

    const inStage2 = !!signDateVal;

    let stage1Fee, stage1Segment, stage1DaysForRender, stage1ActiveForRender;
    if (inStage2) {
      // Stage 1 locked: fee = what was applied at the signing date
      const daysToSign = Math.max(0, daysBetween(approvalDateVal, signDateVal));
      const lockedSeg = getSegmentForDays(STAGE1, daysToSign);
      stage1Fee = lockedSeg.fee;
      stage1Segment = lockedSeg.segmentIndex;
      stage1DaysForRender = daysToSign;
      stage1ActiveForRender = false;
    } else {
      const daysFromApproval = Math.max(0, daysSinceLocal(approvalDateVal));
      const liveSeg = getSegmentForDays(STAGE1, daysFromApproval);
      stage1Fee = liveSeg.fee;
      stage1Segment = liveSeg.segmentIndex;
      stage1DaysForRender = daysFromApproval;
      stage1ActiveForRender = true;
    }

    let stage2Fee = 0;
    let stage2Segment = null;
    let stage2Days = 0;
    if (inStage2 && STAGE2.length) {
      stage2Days = Math.max(0, daysSinceLocal(signDateVal));
      const liveSeg2 = getSegmentForDays(STAGE2, stage2Days);
      stage2Fee = liveSeg2.fee;
      stage2Segment = liveSeg2.segmentIndex;
    }

    const totalTiming = stage1Fee + stage2Fee;
    timingTitle.textContent = 'Deal Closing Cost: ' + totalTiming + '%' + (inStage2 ? ' (Contribution Stage: ' + stage1Fee + '% · Activation Stage: ' + stage2Fee + '%)' : '');

    if (inStage2) {
      if (STAGE2.length && stage2Segment === STAGE2.length - 1) {
        timingText.textContent = 'Activation Stage at maximum deal closing cost.';
      } else if (STAGE2.length) {
        const next2 = STAGE2[stage2Segment + 1];
        const daysLeft2 = STAGE2[stage2Segment].maxDays - stage2Days;
        timingText.textContent = 'Activation Stage: ' + daysLeft2 + ' days until fee increases to ' + next2.fee + '%.';
      } else {
        timingText.textContent = 'Activation Stage not configured.';
      }
    } else {
      const isLast1 = stage1Segment === STAGE1.length - 1;
      if (isLast1) {
        timingText.textContent = 'Contribution Stage at maximum deal closing cost.';
      } else {
        const next1 = STAGE1[stage1Segment + 1];
        const daysLeft1 = STAGE1[stage1Segment].maxDays - stage1DaysForRender;
        const isFirst1 = stage1Segment === 0;
        timingText.textContent = isFirst1
          ? 'Contribution Stage: ' + daysLeft1 + ' days left with no deal closing cost.'
          : '🕐 ' + daysLeft1 + ' days until the fee increases to ' + next1.fee + '%.';
      }
    }

    timingCard.classList.add(totalTiming === 0 ? 'green' : (totalTiming >= (STAGE1[STAGE1.length - 1].fee + (STAGE2.length ? STAGE2[STAGE2.length - 1].fee : 0)) ? 'red' : 'orange'));

    renderTimeline(STAGE1, stage1Segment, stage1DaysForRender, document.getElementById('stage1-bar'), document.getElementById('stage1-labels'), stage1ActiveForRender);
    stage1Section.classList.remove('preview');

    if (STAGE2.length) {
      if (inStage2) {
        renderTimeline(STAGE2, stage2Segment, stage2Days, document.getElementById('stage2-bar'), document.getElementById('stage2-labels'), true);
        stage2Section.classList.remove('preview');
      } else {
        renderTimeline(STAGE2, null, 0, document.getElementById('stage2-bar'), document.getElementById('stage2-labels'), false);
        stage2Section.classList.add('preview');
      }
      stage2Section.style.display = 'block';
    } else {
      stage2Section.style.display = 'none';
    }
  } else {
    // Legacy single-stage path — unchanged behavior
    const daysFromApproval = Math.max(0, daysSinceLocal(approvalDateVal));
    const liveSeg = getSegmentForDays(LEGACY_TIMING, daysFromApproval);
    const isFirst = liveSeg.segmentIndex === 0;
    const isLast = liveSeg.segmentIndex === LEGACY_TIMING.length - 1;
    timingCard.classList.add(isFirst ? 'green' : isLast ? 'red' : 'orange');
    timingTitle.textContent = 'Deal closing cost: ' + liveSeg.fee + '%';
    if (isLast) {
      timingText.textContent = 'Maximum deal closing cost applies.';
    } else {
      const nextFee = LEGACY_TIMING[liveSeg.segmentIndex + 1].fee;
      timingText.textContent = liveSeg.daysLeft + ' days' + (isFirst ? ' left to close with no deal closing cost.' : ' until fee increases to ' + nextFee + '%.');
    }
    renderTimeline(LEGACY_TIMING, liveSeg.segmentIndex, daysFromApproval, document.getElementById('timeline-bar'), document.getElementById('timeline-labels'), true);
  }

  results.classList.add('visible');
}

// Auto-format amount input — preserve trailing zeros while editing
var amountInput = document.getElementById('amount');
amountInput.addEventListener('input', function () {
  var cursorPos = this.selectionStart;
  var beforeLen = this.value.length;
  var raw = this.value.replace(/[^0-9]/g, '');
  if (raw) {
    var parts = [];
    for (var i = raw.length; i > 0; i -= 3) {
      parts.unshift(raw.substring(Math.max(0, i - 3), i));
    }
    this.value = '$' + parts.join(',');
    var diff = this.value.length - beforeLen;
    this.setSelectionRange(cursorPos + diff, cursorPos + diff);
  } else {
    this.value = '';
  }
  calculate();
});
function cleanupAmount() {
  var raw = amountInput.value.replace(/[^0-9]/g, '');
  if (raw && parseInt(raw) > 0) {
    amountInput.value = '$' + parseInt(raw).toLocaleString('en-US');
  } else if (!raw || parseInt(raw) === 0) {
    amountInput.value = '';
  }
}
amountInput.addEventListener('blur', cleanupAmount);
amountInput.addEventListener('change', cleanupAmount);
amountInput.addEventListener('focusout', cleanupAmount);

document.getElementById('approval-date').addEventListener('change', calculate);
document.getElementById('sign-date').addEventListener('change', calculate);
</script>
