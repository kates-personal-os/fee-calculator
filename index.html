<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fee Calculator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #37352f;
    background: transparent;
    padding: 32px 24px;
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.5;
  }

  .input-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 14px;
    color: #787774;
    margin-bottom: 6px;
    font-weight: 500;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid #e3e2e0;
    border-radius: 6px;
    outline: none;
    font-family: inherit;
    color: #37352f;
    transition: border-color 0.15s;
  }

  input:focus {
    border-color: #2eaadc;
    box-shadow: 0 0 0 2px rgba(46, 170, 220, 0.15);
  }

  .results {
    display: none;
    margin-top: 28px;
  }

  .results.visible { display: block; }

  .result-card {
    background: #f7f6f3;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 12px;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
  }

  .result-row + .result-row {
    border-top: 1px solid #e9e8e5;
  }

  .result-label {
    font-size: 14px;
    color: #787774;
  }

  .result-value {
    font-size: 16px;
    font-weight: 600;
    text-align: right;
  }

  .total-row .result-label {
    font-size: 15px;
    font-weight: 600;
    color: #37352f;
  }

  .total-row .result-value {
    font-size: 18px;
  }

  .hint-card {
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 12px;
    font-size: 14px;
    line-height: 1.6;
  }

  .hint-card.blue,
  .hint-card.green,
  .hint-card.orange,
  .hint-card.red {
    background: #f7f6f3;
    color: #4a4a47;
  }

  .hint-title {
    font-weight: 600;
    margin-bottom: 2px;
  }

  .timeline {
    display: flex;
    gap: 2px;
    margin-top: 20px;
    margin-bottom: 8px;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
  }

  .timeline-segment {
    flex: 1;
    background: #e3e2e0;
    position: relative;
    transition: background 0.3s;
  }

  .timeline-segment.passed { background: #787774; }
  .timeline-segment.active {
    background: linear-gradient(to right, #2eaadc var(--progress, 0%), #e3e2e0 var(--progress, 0%));
  }

  .timeline-labels {
    display: flex;
    gap: 2px;
    font-size: 11px;
    color: #a09f9c;
  }

  .timeline-labels span {
    flex: 1;
    text-align: center;
  }

  .timeline-labels span.active {
    color: #2eaadc;
    font-weight: 600;
  }

  .section-label {
    font-size: 12px;
    color: #a09f9c;
    margin-bottom: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .tier-strip {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }

  .tier-hint {
    font-size: 13px;
    color: #a09f9c;
    margin-bottom: 20px;
  }

  .tier-pill {
    flex: 1;
    border: 1.5px solid #e3e2e0;
    border-radius: 8px;
    padding: 10px 4px;
    text-align: center;
    transition: all 0.2s;
  }

  .tier-pill .tier-fee {
    font-size: 15px;
    font-weight: 600;
    color: #787774;
  }

  .tier-pill .tier-range {
    font-size: 11px;
    color: #a09f9c;
    margin-top: 2px;
  }

  .tier-pill.active {
    border-color: #787774;
    background: #f7f6f3;
  }

  .tier-pill.active .tier-fee {
    color: #37352f;
  }

  .tier-pill.active .tier-range {
    color: #787774;
  }

  .tier-pill.passed {
    border-color: #e3e2e0;
    background: transparent;
    opacity: 0.5;
  }

  .error-text {
    color: #eb5757;
    font-size: 13px;
    margin-top: 6px;
    display: none;
  }

  @media (prefers-color-scheme: dark) {
    body { background: #191919; color: #e3e2e0; }
    input { background: #2f2f2f; border-color: #444; color: #e3e2e0; }
    input:focus { border-color: #2eaadc; box-shadow: 0 0 0 2px rgba(46, 170, 220, 0.25); }
    .result-card { background: #2f2f2f; }
    .result-row + .result-row { border-color: #444; }
    .result-label { color: #9b9a97; }
    .total-row .result-label { color: #e3e2e0; }
    .hint-card.blue, .hint-card.green, .hint-card.orange, .hint-card.red { background: #3a3a3a; color: #b0b0ad; }
    .section-label { color: #666; }
    .tier-pill { border-color: #444; }
    .tier-pill .tier-fee { color: #9b9a97; }
    .tier-pill .tier-range { color: #666; }
    .tier-pill.active { border-color: #9b9a97; background: #2f2f2f; }
    .tier-pill.active .tier-fee { color: #e3e2e0; }
    .tier-pill.active .tier-range { color: #9b9a97; }
    .tier-hint { color: #666; }
    .timeline-segment { background: #444; }
    .timeline-segment.active { background: linear-gradient(to right, #2eaadc var(--progress, 0%), #444 var(--progress, 0%)); }
    .timeline-labels { color: #666; }
    label { color: #9b9a97; }
  }

</style>
</head>
<body>

<h2 id="page-title" style="display:none;margin-bottom:24px;font-size:18px;font-weight:600;"></h2>

<div class="input-group">
  <label>Your participation amount (USD)</label>
  <input type="text" id="amount" placeholder="e.g. $6,000,000" inputmode="numeric">
</div>

<div class="input-group" id="date-group">
  <label>Board approval date</label>
  <input type="date" id="approval-date">
</div>

<div class="input-group" id="date-display" style="display:none;">
  <label>Board approval date</label>
  <div id="date-text" style="font-size:16px;font-weight:500;"></div>
</div>

<p class="error-text" id="error"></p>

<div class="results" id="results">


  <div id="tier-section">
    <div class="section-label">Admission fee by pledge amount</div>
    <div class="tier-strip" id="tier-strip"></div>
    <div class="tier-hint" id="tier-hint"></div>
  </div>

  <div class="hint-card" id="timing-card">
    <div class="hint-title" id="timing-title"></div>
    <div id="timing-text"></div>
  </div>

  <div id="timeline-section">
    <div class="section-label">Timing fee by days since board approval</div>
    <div class="timeline" id="timeline-bar"></div>
    <div class="timeline-labels" id="timeline-labels"></div>
  </div>

</div>

<script>
// Config is passed via URL parameters:
// ?tiers=5000000:15,7000000:12,10000000:9.5,12000000:7.5,15000000:7.25,0:7
// &timing=90:0,150:2.5,240:3.75,0:5
// &date=2026-03-15
// &title=Your+Fee+Estimate

const params = new URLSearchParams(window.location.search);

function parseTiers(str) {
  if (!str) return [];
  return str.split(',').map(pair => {
    const [max, fee] = pair.split(':');
    return { max: max === '0' ? Infinity : parseFloat(max), fee: parseFloat(fee) };
  });
}

function parseTiming(str) {
  if (!str) return [];
  return str.split(',').map(pair => {
    const [days, fee] = pair.split(':');
    return { maxDays: days === '0' ? Infinity : parseFloat(days), fee: parseFloat(fee) };
  });
}

const TIERS = parseTiers(params.get('tiers'));
const TIMING = parseTiming(params.get('timing'));
const presetDate = params.get('date');
const pageTitle = params.get('title');

if (!TIERS.length || !TIMING.length) {
  document.body.innerHTML = '<p style="color:#787774;padding:40px;text-align:center;">Calculator not configured.</p>';
}

const presetAmount = params.get('amount');

// Parse date from various formats: "2026-02-10", "10 February 2026", "February 10, 2026"
function normalizeDate(str) {
  if (!str) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  var d = new Date(str);
  if (!isNaN(d)) return d.toISOString().split('T')[0];
  return null;
}

const normalizedDate = normalizeDate(presetDate);

if (normalizedDate) {
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('approval-date').value = normalizedDate;
    document.getElementById('date-group').style.display = 'none';
    var d = new Date(normalizedDate + 'T00:00:00');
    document.getElementById('date-text').textContent = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    document.getElementById('date-display').style.display = 'block';
  });
}

if (presetAmount) {
  document.addEventListener('DOMContentLoaded', function() {
    var num = parseInt(presetAmount.replace(/[^0-9]/g, ''));
    if (num > 0) {
      document.getElementById('amount').value = '$' + num.toLocaleString('en-US');
      calculate();
    }
  });
}

if (pageTitle) {
  document.addEventListener('DOMContentLoaded', function() {
    const h = document.getElementById('page-title');
    if (h) { h.textContent = pageTitle; h.style.display = 'block'; }
  });
}

function getAdmissionFee(amount) {
  for (const t of TIERS) {
    if (amount < t.max) return t.fee;
  }
  return 7;
}

function getNextTier(amount) {
  for (let i = 0; i < TIERS.length - 1; i++) {
    if (amount < TIERS[i].max) {
      const next = TIERS[i + 1];
      const gap = TIERS[i].max - amount;
      return { gap, nextFee: next.fee, threshold: TIERS[i].max };
    }
  }
  return null;
}

function getTimingInfo(approvalDate) {
  // Calendar-date diff in local time. Avoids the UTC-vs-local drift that
  // otherwise shifts the day counter in the Paris small-hours window.
  const [y, m, d] = approvalDate.split('-').map(Number);
  const approvalUTC = Date.UTC(y, m - 1, d);
  const now = new Date();
  const todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((todayUTC - approvalUTC) / 86400000);

  let current = TIMING[0];
  let segmentIndex = 0;
  for (let i = 0; i < TIMING.length; i++) {
    if (days <= TIMING[i].maxDays || i === TIMING.length - 1) {
      current = TIMING[i];
      segmentIndex = i;
      break;
    }
  }

  const daysLeft = current.maxDays === Infinity ? 0 : current.maxDays - days;
  return { days, fee: current.fee, daysLeft, segmentIndex };
}

function formatUSD(n) {
  return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
}

function formatCompact(n) {
  if (n >= 1e6) return '$' + (n / 1e6) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3) + 'K';
  return '$' + n;
}

function parseAmount(str) {
  return parseFloat(str.replace(/[^0-9.]/g, ''));
}

function calculate() {
  const raw = document.getElementById('amount').value;
  const dateVal = document.getElementById('approval-date').value;
  const results = document.getElementById('results');
  const error = document.getElementById('error');

  const amount = parseAmount(raw);
  if (!amount || amount <= 0) {
    results.classList.remove('visible');
    error.style.display = 'none';
    return;
  }
  if (!dateVal) {
    results.classList.remove('visible');
    error.textContent = 'Please select a board approval date.';
    error.style.display = 'block';
    return;
  }

  error.style.display = 'none';

  const admissionFee = getAdmissionFee(amount);
  const timing = getTimingInfo(dateVal);
  const totalPct = admissionFee + timing.fee;
  const feeAmount = amount * totalPct / 100;

  // Tier strip
  const strip = document.getElementById('tier-strip');
  strip.innerHTML = '';
  for (let i = 0; i < TIERS.length; i++) {
    const pill = document.createElement('div');
    pill.className = 'tier-pill';
    const tierFee = TIERS[i].fee;
    const isActive = tierFee === admissionFee;
    const isPassed = TIERS[i].fee > admissionFee;
    if (isActive) pill.classList.add('active');
    if (isPassed) pill.classList.add('passed');

    let rangeLabel;
    if (i === 0) {
      rangeLabel = '<' + formatCompact(TIERS[0].max);
    } else if (TIERS[i].max === Infinity) {
      rangeLabel = '≥' + formatCompact(TIERS[i - 1].max);
    } else {
      rangeLabel = '≥' + formatCompact(TIERS[i - 1].max);
    }

    pill.innerHTML = '<div class="tier-fee">' + tierFee + '%</div><div class="tier-range">' + rangeLabel + '</div>';
    strip.appendChild(pill);
  }

  // Tier hint line
  const nextTier = getNextTier(amount);
  const tierHint = document.getElementById('tier-hint');
  if (nextTier) {
    tierHint.textContent = 'Your fee: ' + admissionFee + '%. Add ' + formatUSD(nextTier.gap) + ' to reach ' + nextTier.nextFee + '%';
  } else {
    tierHint.textContent = 'Your fee: ' + admissionFee + '% — lowest tier';
  }

  // Timing hint
  const timingCard = document.getElementById('timing-card');
  const timingTitle = document.getElementById('timing-title');
  const timingText = document.getElementById('timing-text');

  timingCard.className = 'hint-card';
  const isFirst = timing.segmentIndex === 0;
  const isLast = timing.segmentIndex === TIMING.length - 1;
  timingCard.classList.add(isFirst ? 'green' : isLast ? 'red' : 'orange');
  timingTitle.textContent = 'Timing fee: ' + timing.fee + '%';
  if (isLast) {
    timingText.textContent = 'Maximum timing fee applies.';
  } else {
    const nextFee = TIMING[timing.segmentIndex + 1].fee;
    timingText.textContent = timing.daysLeft + ' days' + (isFirst ? ' left to close with no timing fee.' : ' until fee increases to ' + nextFee + '%.');
  }

  // Timeline
  const bar = document.getElementById('timeline-bar');
  const labels = document.getElementById('timeline-labels');
  bar.innerHTML = '';
  labels.innerHTML = '';
  let prevMax = 0;
  for (let i = 0; i < TIMING.length; i++) {
    const seg = document.createElement('div');
    seg.className = 'timeline-segment';
    if (i < timing.segmentIndex) {
      seg.classList.add('passed');
    } else if (i === timing.segmentIndex) {
      seg.classList.add('active');
      const segStart = i === 0 ? 0 : TIMING[i - 1].maxDays;
      const segEnd = TIMING[i].maxDays === Infinity ? segStart + 90 : TIMING[i].maxDays;
      const progress = Math.min(100, Math.max(0, (timing.days - segStart) / (segEnd - segStart) * 100));
      seg.style.setProperty('--progress', progress + '%');
    }
    bar.appendChild(seg);

    const lbl = document.createElement('span');
    const rangeStart = prevMax === 0 ? '0' : (prevMax + 1);
    const rangeEnd = TIMING[i].maxDays === Infinity ? '+' : TIMING[i].maxDays;
    lbl.innerHTML = (TIMING[i].maxDays === Infinity ? prevMax + '+' : rangeStart + '–' + rangeEnd) + ' days<br>' + TIMING[i].fee + '%';
    if (i === timing.segmentIndex) lbl.classList.add('active');
    labels.appendChild(lbl);
    if (TIMING[i].maxDays !== Infinity) prevMax = TIMING[i].maxDays;
  }

  results.classList.add('visible');
}

// Auto-format amount input — preserve trailing zeros while editing
var amountInput = document.getElementById('amount');
amountInput.addEventListener('input', function () {
  var cursorPos = this.selectionStart;
  var beforeLen = this.value.length;
  var raw = this.value.replace(/[^0-9]/g, '');
  if (raw) {
    // Format without parseInt to preserve digits like "0007000000"
    var parts = [];
    for (var i = raw.length; i > 0; i -= 3) {
      parts.unshift(raw.substring(Math.max(0, i - 3), i));
    }
    this.value = '$' + parts.join(',');
    var diff = this.value.length - beforeLen;
    this.setSelectionRange(cursorPos + diff, cursorPos + diff);
  } else {
    this.value = '';
  }
  calculate();
});
// Clean up leading zeros on blur/change
function cleanupAmount() {
  var raw = amountInput.value.replace(/[^0-9]/g, '');
  if (raw && parseInt(raw) > 0) {
    amountInput.value = '$' + parseInt(raw).toLocaleString('en-US');
  } else if (!raw || parseInt(raw) === 0) {
    amountInput.value = '';
  }
}
amountInput.addEventListener('blur', cleanupAmount);
amountInput.addEventListener('change', cleanupAmount);
amountInput.addEventListener('focusout', cleanupAmount);

document.getElementById('approval-date').addEventListener('change', calculate);
</script>

</body>
</html>
